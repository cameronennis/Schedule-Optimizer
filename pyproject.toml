[project]
name = "schedule-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cameronennis", email = "cameron.bruce.ennis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "keyring>=25.7.0",
    "ortools>=9.15.6755",
    "platformdirs>=4.14.5",
    "tzdata>=2026.6",
]

[project.scripts]
schedule-optimizer = "schedule_optimizer:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
